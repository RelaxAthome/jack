<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Set a new password</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main style="max-width:520px;margin:48px auto;padding:24px;">
    <h1>Set a new password</h1>
    <div id="status" style="margin-bottom:12px;">Initializing…</div>

    <!-- Form is hidden until recovery session is validated -->
    <form id="resetForm" style="display:none;">
      <label for="password">New password</label><br/>
      <input id="password" type="password" required style="width:100%;padding:8px;margin:8px 0" />
      <label for="confirm">Confirm password</label><br/>
      <input id="confirm" type="password" required style="width:100%;padding:8px;margin:8px 0" />
      <button type="submit">Set new password</button>
    </form>

    <div id="message" style="margin-top:12px;color:#333"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-client.js"></script>
  <script>
    // Redirect target after success — use the existing admin login page path in the repo
    const ADMIN_LOGIN_PATH = './Admin%20login%20html';

    const statusEl = document.getElementById('status');
    const messageEl = document.getElementById('message');
    const form = document.getElementById('resetForm');

    (async function init() {
      statusEl.textContent = 'Checking recovery link…';
      try {
        const { data, error } = await supabaseClient.auth.getSessionFromUrl({ storeSession: true });
        if (error) {
          // If token cannot be consumed, show an explicit message and do not show the form
          statusEl.textContent = 'Invalid or expired recovery link.';
          messageEl.textContent = 'The recovery link appears invalid or expired. Request a new password reset from the login page.';
          return;
        }

        const session = data?.session ?? null;
        if (!session) {
          statusEl.textContent = 'No recovery session found.';
          messageEl.textContent = 'Open the password reset link from your email. If this error persists, request a new reset.';
          return;
        }

        statusEl.textContent = 'Recovery link validated. You may set a new password.';
        form.style.display = 'block';
      } catch (err) {
        statusEl.textContent = 'Error handling recovery link.';
        messageEl.textContent = 'Unexpected error: ' + (err.message || err);
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.textContent = '';
      const pw = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (!pw || pw !== confirm) {
        messageEl.textContent = 'Passwords do not match.';
        return;
      }

      messageEl.textContent = 'Updating password…';
      try {
        const { data, error } = await supabaseClient.auth.updateUser({ password: pw });
        if (error) {
          messageEl.textContent = 'Failed to update password: ' + error.message;
          return;
        }

        messageEl.textContent = 'Password updated successfully. Redirecting to Admin Login…';
        setTimeout(() => { window.location.href = ADMIN_LOGIN_PATH; }, 1200);
      } catch (err) {
        messageEl.textContent = 'Unexpected error: ' + (err.message || err);
      }
    });
  </script>
</body>
</html>
