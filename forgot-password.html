<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Forgot password</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main style="max-width:520px;margin:48px auto;padding:24px;">
    <h1>Reset your password</h1>
    <form id="forgotForm">
      <label for="email">Email</label><br/>
      <input id="email" type="email" required autocomplete="email" style="width:100%;padding:8px;margin:8px 0" />
      <button type="submit">Send password reset email</button>
    </form>
    <div id="message" style="margin-top:12px;color:#333"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-client.js"></script>
  <script>
    // Recovery redirect must exactly match the URL added to Supabase Redirect URLs
    const RESET_PAGE_URL = 'https://relaxathome.github.io/jack/reset-password.html';

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const messageEl = document.getElementById('message');
      messageEl.textContent = 'Sending reset email…';

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: RESET_PAGE_URL
      });

      if (error) {
        messageEl.textContent = 'Error: ' + error.message;
        return;
      }
      messageEl.textContent = 'If that account exists you will receive a reset email.';
    });
  </script>
</body>
</html>
