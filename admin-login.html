<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RelaxAtHome Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0f4c48 0%, #1a6b64 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      padding: 40px;
    }
    @media (max-width: 600px) {
      .login-container {
        padding: 30px 20px;
      }
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-logo {
      font-size: 32px;
      font-weight: 700;
      color: #0f4c48;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }
    .login-header h1 {
      color: #173b39;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .login-header p {
      color: #647875;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 500;
      color: #173b39;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dce4df;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #0f4c48;
      box-shadow: 0 0 0 3px rgba(15, 76, 72, 0.1);
    }
    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .remember-forgot a {
      color: #0f4c48;
      text-decoration: none;
    }
    .remember-forgot a:hover {
      text-decoration: underline;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    input[type="checkbox"] {
      width: auto;
      cursor: pointer;
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    .btn-login {
      flex: 1;
      padding: 12px;
      background: #0f4c48;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: #0a3a37;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15, 76, 72, 0.3);
    }
    .btn-login:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }
    .btn-back {
      flex: 1;
      padding: 12px;
      background: #dbe7df;
      color: #173b39;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-back:hover {
      background: #c9d5cf;
    }
    .message {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #2e7d32;
      display: block;
    }
    .message.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #c62828;
      display: block;
    }
    .message.info {
      background: #e3f2fd;
      color: #1565c0;
      border-left: 4px solid #1565c0;
      display: block;
    }
    .no-account {
      text-align: center;
      font-size: 13px;
      color: #647875;
      margin-top: 20px;
    }
    .no-account a {
      color: #0f4c48;
      font-weight: 600;
      text-decoration: none;
    }
    .no-account a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">R</div>
      <h1>Admin Login</h1>
      <p>RelaxAtHome Dashboard</p>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="admin@relaxathome.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="remember-forgot">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe" />
          <span>Remember me</span>
        </label>
        <a href="admin-forgot-password.html">Forgot password?</a>
      </div>

      <div class="button-group">
        <button type="submit" class="btn-login" id="submitBtn">Sign In</button>
        <button type="button" class="btn-back" onclick="location.href='index.html'">← Back</button>
      </div>
    </form>

    <div class="no-account">
      First time? <a href="admin-setup.html">Create an admin account</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin-lib.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
      messageDiv.innerHTML = text;
      messageDiv.className = `message ${type}`;
    }

    window.addEventListener('load', async () => {
      const savedEmail = localStorage.getItem('remember_admin_email');
      if (savedEmail) {
        document.getElementById('email').value = savedEmail;
        rememberMeCheckbox.checked = true;
      }

      const session = await checkAdminSession();
      if (session) {
        location.href = 'admin-dashboard.html';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        showMessage('Signing in...', 'info');
        const result = await adminSignIn(email, password);

        if (result.success) {
          if (rememberMeCheckbox.checked) {
            localStorage.setItem('remember_admin_email', email);
          } else {
            localStorage.removeItem('remember_admin_email');
          }
          showMessage('✓ Signed in successfully', 'success');
          setTimeout(() => {
            location.href = 'admin-dashboard.html';
          }, 500);
        } else {
          showMessage('Error: ' + result.error, 'error');
          submitBtn.disabled = false;
        }
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
