<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — RelaxAtHome</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .admin-login-wrap{max-width:400px;margin:80px auto;padding:32px;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,0.1);background:#fff;}
  .admin-login-wrap h1{font-size:1.4rem;margin-bottom:24px}
  .admin-login-wrap input{width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
  .admin-login-wrap button{width:100%;padding:10px;border:none;border-radius:6px;background:#111;color:#fff;cursor:pointer}
  .admin-login-wrap button:disabled{opacity:0.6;cursor:not-allowed}
  #login-error{color:#c0392b;font-size:0.9rem;margin-top:8px;min-height:1.2em}
</style>
</head>
<body>

<div class="admin-login-wrap">
  <h1>Admin Login</h1>
  <form id="login-form">
    <input type="email" id="email" placeholder="Email" required autocomplete="username" />
    <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
    <button type="submit" id="login-btn">Log in</button>
  </form>
  <div id="login-error"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
  // If already logged in, go straight to the dashboard.
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "admin-dashboard.html";
  });

  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Logging in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = "Login failed: " + error.message;
      btn.disabled = false;
      btn.textContent = "Log in";
      return;
    }

    window.location.href = "admin-dashboard.html";
  });
</script>

</body>
</html>
