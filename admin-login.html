<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RelaxAtHome Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0f4c48 0%, #1a6b64 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      padding: 40px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-logo {
      font-size: 32px;
      font-weight: 700;
      color: #0f4c48;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }
    .login-header h1 {
      color: #173b39;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .login-header p {
      color: #647875;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 500;
      color: #173b39;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dce4df;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #0f4c48;
      box-shadow: 0 0 0 3px rgba(15, 76, 72, 0.1);
    }
    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .remember-forgot a {
      color: #0f4c48;
      text-decoration: none;
    }
    .remember-forgot a:hover {
      text-decoration: underline;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    input[type="checkbox"] {
      width: auto;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #0f4c48;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 15px;
    }
    .btn-login:hover {
      background: #0a3a37;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15, 76, 72, 0.3);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-back {
      width: 100%;
      padding: 12px;
      background: #dbe7df;
      color: #173b39;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-back:hover {
      background: #c9d5cf;
    }
    .message {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #2e7d32;
      display: block;
    }
    .message.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #c62828;
      display: block;
    }
    .no-account {
      text-align: center;
      font-size: 13px;
      color: #647875;
      margin-top: 20px;
    }
    .no-account a {
      color: #0f4c48;
      font-weight: 600;
      text-decoration: none;
    }
    .no-account a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">R</div>
      <h1>Admin Login</h1>
      <p>RelaxAtHome Dashboard</p>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="admin@relaxathome.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="remember-forgot">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe" />
          <span>Remember me</span>
        </label>
        <a href="#" id="forgotPasswordLink">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login">Sign In</button>
      <button type="button" class="btn-back" onclick="location.href='index.html'">← Back to Website</button>
    </form>

    <div class="no-account">
      First time? <a href="admin-setup.html">Create an admin account</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');

    // Load saved email if "Remember me" was checked
    window.addEventListener('load', () => {
      const savedEmail = localStorage.getItem('remember_admin_email');
      if (savedEmail) {
        document.getElementById('email').value = savedEmail;
        rememberMeCheckbox.checked = true;
      }

      // Check if already logged in
      const adminSession = sessionStorage.getItem('admin_session');
      if (adminSession) {
        location.href = 'admin-dashboard.html';
      }
    });

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Get stored credentials
      const storedEmail = localStorage.getItem('admin_email');
      const storedPasswordHash = localStorage.getItem('admin_password_hash');

      if (!storedEmail) {
        showMessage('No admin account found. Please <a href="admin-setup.html">create one first</a>.', 'error');
        return;
      }

      if (email !== storedEmail) {
        showMessage('Invalid email or password', 'error');
        return;
      }

      try {
        // Verify password against hash
        const passwordMatch = await bcrypt.compare(password, storedPasswordHash);

        if (!passwordMatch) {
          showMessage('Invalid email or password', 'error');
          return;
        }

        // Create session token (simple)
        const sessionToken = btoa(email + ':' + Date.now());
        sessionStorage.setItem('admin_session', sessionToken);
        sessionStorage.setItem('admin_email', email);

        // Save email if "Remember me" is checked
        if (rememberMeCheckbox.checked) {
          localStorage.setItem('remember_admin_email', email);
        } else {
          localStorage.removeItem('remember_admin_email');
        }

        showMessage('✓ Logging in...', 'success');
        setTimeout(() => {
          location.href = 'admin-dashboard.html';
        }, 500);
      } catch (error) {
        showMessage('Error during login. Please try again.', 'error');
        console.error(error);
      }
    });

    // Password reset functionality
    forgotPasswordLink.addEventListener('click', (e) => {
      e.preventDefault();
      const newPassword = prompt('Enter your new password (must be 8+ chars with uppercase, lowercase, and number):');
      if (!newPassword) return;

      const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
      if (!passwordRegex.test(newPassword)) {
        alert('Password must be at least 8 characters with uppercase, lowercase, and number');
        return;
      }

      const confirmPassword = prompt('Confirm your new password:');
      if (newPassword !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }

      bcrypt.hash(newPassword, 12).then((hash) => {
        localStorage.setItem('admin_password_hash', hash);
        showMessage('✓ Password reset successfully', 'success');
        document.getElementById('password').value = '';
      });
    });
  </script>
</body>
</html>
