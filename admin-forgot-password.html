<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - RelaxAtHome Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0f4c48 0%, #1a6b64 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
      padding: 40px;
    }
    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      color: #173b39;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .header p {
      color: #647875;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 500;
      color: #173b39;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dce4df;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #0f4c48;
      box-shadow: 0 0 0 3px rgba(15, 76, 72, 0.1);
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0f4c48;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0a3a37;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15, 76, 72, 0.3);
    }
    .btn-primary:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: #dbe7df;
      color: #173b39;
    }
    .btn-secondary:hover {
      background: #c9d5cf;
    }
    .message {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #2e7d32;
      display: block;
    }
    .message.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #c62828;
      display: block;
    }
    .message.info {
      background: #e3f2fd;
      color: #1565c0;
      border-left: 4px solid #1565c0;
      display: block;
    }
    .info-box {
      background: #f6f5f0;
      border-left: 4px solid #c99b62;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #647875;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Reset Password</h1>
      <p>Enter your email to receive a reset link</p>
    </div>

    <div id="message" class="message"></div>

    <div class="info-box">
      Enter your admin email address and we'll send you a password reset link.
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="admin@relaxathome.com"
          required
        />
      </div>

      <div class="button-group">
        <button type="submit" class="btn-primary" id="submitBtn">Send Reset Link</button>
        <button type="button" class="btn-secondary" onclick="location.href='admin-login.html'">Back to Login</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin-lib.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
      messageDiv.innerHTML = text;
      messageDiv.className = `message ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;

      const email = document.getElementById('email').value.trim();

      try {
        showMessage('Sending reset link...', 'info');
        const result = await requestPasswordReset(email);

        if (result.success) {
          showMessage('✓ Reset link sent! Check your email for instructions.', 'success');
          form.reset();
          setTimeout(() => {
            location.href = 'admin-login.html';
          }, 3000);
        } else {
          showMessage('Error: ' + result.error, 'error');
          submitBtn.disabled = false;
        }
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
