<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RelaxAtHome Admin Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0f4c48 0%, #1a6b64 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .setup-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      padding: 40px;
    }
    .setup-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .setup-header h1 {
      color: #173b39;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .setup-header p {
      color: #647875;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 500;
      color: #173b39;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dce4df;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #0f4c48;
      box-shadow: 0 0 0 3px rgba(15, 76, 72, 0.1);
    }
    .password-requirements {
      background: #f6f5f0;
      border-left: 4px solid #c99b62;
      padding: 12px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
      color: #647875;
      line-height: 1.5;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0f4c48;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0a3a37;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15, 76, 72, 0.3);
    }
    .btn-secondary {
      background: #dbe7df;
      color: #173b39;
    }
    .btn-secondary:hover {
      background: #c9d5cf;
    }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .message.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #2e7d32;
      display: block;
    }
    .message.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #c62828;
      display: block;
    }
    .warning-box {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #856404;
    }
    a {
      color: #0f4c48;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="setup-container">
    <div class="setup-header">
      <h1>Admin Setup</h1>
      <p>Create your first administrator account</p>
    </div>

    <div class="warning-box">
      ⚠️ <strong>Important:</strong> Run this setup only ONCE. After creation, go to <a href="admin-login.html">admin-login.html</a> to log in.
    </div>

    <form id="setupForm">
      <div class="form-group">
        <label for="adminEmail">Admin Email Address</label>
        <input
          type="email"
          id="adminEmail"
          placeholder="admin@relaxathome.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input
          type="password"
          id="adminPassword"
          placeholder="Enter a strong password"
          required
        />
        <div class="password-requirements">
          ✓ Minimum 8 characters<br />
          ✓ Mix of uppercase and lowercase<br />
          ✓ At least one number
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Re-enter your password"
          required
        />
      </div>

      <div class="button-group">
        <button type="submit" class="btn-primary">Create Admin Account</button>
        <button type="button" class="btn-secondary" onclick="location.href='index.html'">Cancel</button>
      </div>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script>
    const form = document.getElementById('setupForm');
    const messageDiv = document.getElementById('message');

    // Check if admin already exists
    window.addEventListener('load', () => {
      const adminEmail = localStorage.getItem('admin_email');
      if (adminEmail) {
        showMessage('Admin account already exists! Please log in at <a href="admin-login.html">admin-login.html</a>', 'error');
        form.style.display = 'none';
      }
    });

    function showMessage(text, type) {
      messageDiv.innerHTML = text;
      messageDiv.className = `message ${type}`;
    }

    function validatePassword(password) {
      const hasUpperCase = /[A-Z]/.test(password);
      const hasLowerCase = /[a-z]/.test(password);
      const hasNumber = /[0-9]/.test(password);
      const isLongEnough = password.length >= 8;

      if (!isLongEnough) return 'Password must be at least 8 characters';
      if (!hasUpperCase) return 'Password must contain uppercase letters';
      if (!hasLowerCase) return 'Password must contain lowercase letters';
      if (!hasNumber) return 'Password must contain numbers';

      return null;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Validate email
      if (!email.includes('@')) {
        showMessage('Please enter a valid email address', 'error');
        return;
      }

      // Validate password
      const passwordError = validatePassword(password);
      if (passwordError) {
        showMessage(passwordError, 'error');
        return;
      }

      // Confirm password match
      if (password !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return;
      }

      try {
        // Hash password
        const hashedPassword = await bcrypt.hash(password, 12);

        // Store admin credentials (securely hashed)
        localStorage.setItem('admin_email', email);
        localStorage.setItem('admin_password_hash', hashedPassword);

        // Initialize admin data structures
        localStorage.setItem('admin_appointments', JSON.stringify([]));
        localStorage.setItem('admin_inquiries', JSON.stringify([]));
        localStorage.setItem('admin_therapists', JSON.stringify([]));
        localStorage.setItem('admin_business_settings', JSON.stringify({
          businessName: 'RelaxAtHome',
          businessHours: '10:00 AM – 11:00 PM',
          serviceAreas: ['Delhi', 'Noida', 'Gurugram'],
          maxAppointmentsPerDay: 20
        }));

        showMessage('✓ Admin account created successfully! <a href="admin-login.html">Go to Login</a>', 'success');
        form.reset();
        setTimeout(() => {
          location.href = 'admin-login.html';
        }, 2000);
      } catch (error) {
        showMessage('Error creating account. Please try again.', 'error');
        console.error(error);
      }
    });
  </script>
</body>
</html>
